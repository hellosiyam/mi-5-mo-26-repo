<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Gem</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="">
    <header>

    </header>
    <main class="mx-5">
        <!-- Shape Area -->
        <div>
            <div class="card bg-base-100 w-96 shadow-xl p-4">
                <figure class="mb-12 mt-12">
                  <img
                    src="images/triangle.png"
                    alt="triangle" />
                </figure>
                <div class="text-center">
                  <h2 class="items-center text-lg font-medium mb-3">Triangle</h2>
                  <p class="text-base mb-6">Area (A) = 0.5  X  b  X  h</p>
                  <!-- Input Section -->
                  <div class="mb-12">
                    <input type="text" placeholder="b" class="bg-[#F1F1F1] h-12 w-24 rounded ml-4 p-3 text-[#414141]"> <span class="ml-3 font-semibold text-base">cm</span>
                    <input type="text" placeholder="h" class="bg-[#F1F1F1] h-12 w-24 rounded  ml-4 p-3 text-[#414141]"> <span class="ml-3 font-semibold text-base">cm</span>
                  </div>
                  <div class="w-auto justify-center">
                    <button class="btn h-14 w-full bg-[#1090D8] text-white font-bold text-xl">Calculate</button>
                  </div>
                </div>
              </div>
        </div>
        <!-- Calcolation Area -->
         <div>

         </div>
    </main>
</body>
</html>
